name: Converter CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Configure Windows x64
        # Keep the developer preset; select the compiler installed on this runner.
        run: cmake --preset windows-x64 -G "Visual Studio 17 2022"
      - name: Build converter
        run: cmake --build --preset windows-x64-debug
      - name: Verify retention failure and recovery paths
        shell: powershell
        run: ./tests/test-local-retention.ps1
      - name: Verify real IMG conversion and managed output
        shell: powershell
        run: ./tests/test-output.ps1 -ConverterPath ./x64/Debug/NoLifeWzToNx.exe
